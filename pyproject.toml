[project]
name = "agentic-project-template"
version = "0.4.1"
description = "A reusable engineering harness for agent-developed projects"
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
relative_files = true
